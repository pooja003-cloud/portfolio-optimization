name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline smoke run (synthetic data)
        run: python -m portopt.run --synthetic --no-llm
      - run: python -m portopt.robustness --synthetic --n-boot 500
